<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Flame Simulation — 2D Contour Viewer</title>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; margin: 16px; }
    h2 { margin: 0 0 12px; }
    .controls { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: flex-end; margin-bottom: 10px; }
    .control { display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
    .control label { color: #444; }
    select { min-width: 130px; padding: 4px 6px; border: 1px solid #ccc; border-radius: 4px; }
    #reset { padding: 5px 14px; border: 1px solid #ccc; border-radius: 4px; background: #f5f5f5; cursor: pointer; }
    #reset:hover { background: #e8e8e8; }
    #status { color: #555; font-size: 13px; margin: 8px 0; min-height: 18px; }
    #plot { width: 100%; height: 68vh; }
    .placeholder { display: flex; align-items: center; justify-content: center; height: 100%; color: #888; font-size: 15px; }
  </style>
</head>
<body>
  <h2>Flame Simulation — 2D Contour Viewer</h2>
  <div class="controls" id="controls"></div>
  <div id="status">Loading…</div>
  <div id="plot"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
